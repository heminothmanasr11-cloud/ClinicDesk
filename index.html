<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClinicDesk Sync</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f5f7fb;color:#172033}header{padding:16px 24px;background:white;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:800;color:#2563eb}.hidden{display:none!important}#auth{min-height:100vh;display:grid;place-items:center}.box,.card{background:white;border:1px solid #ddd;border-radius:12px;padding:24px}.box{width:min(420px,90vw)}input,select,textarea{width:100%;padding:10px;margin:5px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:white;border:1px solid #ddd}nav{width:210px;background:white;padding:10px}nav button{display:block;width:100%;text-align:left;background:none;margin:3px}main{padding:24px;flex:1}.layout{display:flex}.page{display:none}.page.active{display:block}.grid,.two{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.two{grid-template-columns:1fr 1fr}.stat{font-size:32px;font-weight:800;color:#2563eb}table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.small{color:#667085;font-size:13px}@media(max-width:800px){.grid,.two{grid-template-columns:1fr}nav{width:70px}.layout{display:flex}}
</style></head><body>
<div id="auth"><div class="box"><div class="brand">ClinicDesk</div><p class="small">Real-time clinic synchronization</p><button onclick="mode('login')">Sign In</button> <button onclick="mode('register')">Create Account</button><div id="roleWrap" class="hidden"><label>Role</label><select id="role"><option value="doctor">Doctor</option><option value="secretary">Secretary</option></select></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" id="authBtn" onclick="handleAuth()">Sign In</button><p id="error" style="color:#dc2626"></p></div></div>
<div id="app" class="hidden"><header><div class="brand">ClinicDesk <span class="small">Sync</span></div><div><span id="who" class="small"></span> <button class="secondary" onclick="logout()">Sign Out</button></div></header><div class="layout"><nav><button onclick="page('dash')">Dashboard</button><button onclick="page('patients')">Patients</button><button onclick="page('visits')">Consultations</button><button onclick="page('appointments')">Appointments</button></nav><main>
<section id="dash" class="page active"><h1>Dashboard</h1><div class="grid"><div class="card"><div id="pc" class="stat">0</div>Patients</div><div class="card"><div id="vc" class="stat">0</div>Consultations</div><div class="card"><div id="ac" class="stat">0</div>Appointments Today</div></div></section>
<section id="patients" class="page"><h1>Patients</h1><button class="primary" onclick="showPatientForm()">+ New Patient</button><div id="pf" class="card hidden"></div><table><thead><tr><th>Name</th><th>Phone</th><th>ID</th></tr></thead><tbody id="pt"></tbody></table></section>
<section id="visits" class="page"><h1>Consultations</h1><div id="vf" class="card"></div><table><thead><tr><th>Date</th><th>Patient</th><th>Complaint</th><th>Diagnosis</th></tr></thead><tbody id="vt"></tbody></table></section>
<section id="appointments" class="page"><h1>Appointments</h1><button class="primary" onclick="showAppointmentForm()">+ New Appointment</button><div id="af" class="card hidden"></div><table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th></tr></thead><tbody id="at"></tbody></table></section>
</main></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,onSnapshot,serverTimestamp,query,orderBy}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAvtrRdkedS3BrfOxud_IDvSq8HZ-WKITU",authDomain:"clinic-system-1959d.firebaseapp.com",projectId:"clinic-system-1959d",storageBucket:"clinic-system-1959d.firebasestorage.app",messagingSenderId:"520009437911",appId:"1:520009437911:web:6af77ec4de0438b7d85692"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let m="login",profile,patients=[],visits=[],appointments=[],un=[];
const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),name=id=>patients.find(x=>x.id===id)?.name||"Unknown";
window.mode=x=>{m=x;$("roleWrap").classList.toggle("hidden",x==="login");$("authBtn").textContent=x==="login"?"Sign In":"Create Account"};
window.handleAuth=async()=>{try{let e=$("email").value,p=$("password").value;if(m==="login")await signInWithEmailAndPassword(auth,e,p);else{let u=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,"users",u.user.uid),{email:e,role:$("role").value,createdAt:serverTimestamp()})}}catch(x){$("error").textContent=x.message}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{un.forEach(x=>x());un=[];if(!u){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}let s=await getDoc(doc(db,"users",u.uid));profile=s.data();$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=u.email+" • "+profile.role.toUpperCase();un.push(onSnapshot(query(collection(db,"patients"),orderBy("createdAt","desc")),s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));render()}));un.push(onSnapshot(query(collection(db,"appointments"),orderBy("date","asc")),s=>{appointments=s.docs.map(d=>({id:d.id,...d.data()}));render()}));if(profile.role==="doctor")un.push(onSnapshot(query(collection(db,"visits"),orderBy("date","desc")),s=>{visits=s.docs.map(d=>({id:d.id,...d.data()}));render()}));render()});
window.page=id=>{document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")};
window.showPatientForm=()=>{$("pf").classList.remove("hidden");$("pf").innerHTML='<h2>New Patient</h2><div class="two"><div><label>Name</label><input id="pn"></div><div><label>Phone</label><input id="pp"></div><div><label>Date of Birth</label><input id="pd" type="date"></div><div><label>Gender</label><input id="pg"></div></div><label>Medical History</label><textarea id="pm"></textarea><label>Allergies</label><textarea id="pal"></textarea><button class="primary" onclick="savePatient()">Save Patient</button>'};
window.savePatient=async()=>{if(!$("pn").value)return alert("Name required");await addDoc(collection(db,"patients"),{name:$("pn").value,phone:$("pp").value,dob:$("pd").value,gender:$("pg").value,medicalHistory:$("pm").value,allergies:$("pal").value,createdAt:serverTimestamp()});$("pf").classList.add("hidden")};
function visitForm(){if(!profile)return;if(profile.role!=="doctor"){$("vf").innerHTML="<b>Consultations are available only to the Doctor account.</b>";return}$("vf").innerHTML='<h2>New Consultation</h2><label>Patient</label><select id="vp">'+patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")+'</select><div class="two"><div><label>Date</label><input id="vd" type="date" value="'+today()+'"></div><div><label>Diagnosis</label><input id="vdiag"></div></div><label>Chief Complaint</label><textarea id="vcomp"></textarea><label>Prescription / Treatment</label><textarea id="vpres"></textarea><button class="primary" onclick="saveVisit()">Save Consultation</button>'}
window.saveVisit=async()=>{await addDoc(collection(db,"visits"),{patientId:$("vp").value,date:$("vd").value,diagnosis:$("vdiag").value,complaint:$("vcomp").value,prescription:$("vpres").value,createdAt:serverTimestamp()});alert("Consultation saved")};
window.showAppointmentForm=()=>{$("af").classList.remove("hidden");$("af").innerHTML='<h2>New Appointment</h2><label>Patient</label><select id="ap">'+patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")+'</select><div class="two"><div><label>Date</label><input id="ad" type="date" value="'+today()+'"></div><div><label>Time</label><input id="ati" type="time"></div></div><label>Reason</label><input id="ar"><button class="primary" onclick="saveAppointment()">Save Appointment</button>'};
window.saveAppointment=async()=>{await addDoc(collection(db,"appointments"),{patientId:$("ap").value,date:$("ad").value,time:$("ati").value,reason:$("ar").value,status:"Scheduled",createdAt:serverTimestamp()});$("af").classList.add("hidden")};
window.toggleAppointment=async id=>{let a=appointments.find(x=>x.id===id);await updateDoc(doc(db,"appointments",id),{status:a.status==="Completed"?"Scheduled":"Completed"})};
function render(){pc.textContent=patients.length;vc.textContent=visits.length;ac.textContent=appointments.filter(x=>x.date===today()).length;pt.innerHTML=patients.map(p=>`<tr><td>${p.name||""}</td><td>${p.phone||""}</td><td>${p.id.slice(0,8)}</td></tr>`).join("");at.innerHTML=appointments.map(a=>`<tr onclick="toggleAppointment('${a.id}')"><td>${a.date}</td><td>${a.time||""}</td><td>${name(a.patientId)}</td><td>${a.reason||""}</td><td>${a.status}</td></tr>`).join("");vt.innerHTML=visits.map(v=>`<tr><td>${v.date}</td><td>${name(v.patientId)}</td><td>${v.complaint||""}</td><td>${v.diagnosis||""}</td></tr>`).join("");visitForm()}
</script></body></html>
